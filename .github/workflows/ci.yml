name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t notifyhub:ci .

  # Continuous deployment: add a deploy job here (for example a Render / Railway / Fly.io deploy hook) that runs
  # only on pushes to main, after the jobs above have passed.
